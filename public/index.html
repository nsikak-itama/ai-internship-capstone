<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Settings</h1>
        <p class="page-subtitle">Manage your profile, preferences, and notifications.</p>
      </header>

      <form id="settings-form" class="settings-form" novalidate>
        <section class="form-section" aria-labelledby="profile-heading">
          <h2 id="profile-heading">Profile</h2>
          <div class="field">
            <label for="display-name">Display name</label>
            <input
              type="text"
              id="display-name"
              name="displayName"
              autocomplete="name"
              placeholder="Your name"
              required
              minlength="2"
              maxlength="50"
            />
            <p class="field-error" id="display-name-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
            <p class="field-error" id="email-error" role="alert"></p>
          </div>
        </section>

        <section class="form-section" aria-labelledby="preferences-heading">
          <h2 id="preferences-heading">Preferences</h2>

          <div class="field">
            <label for="theme">Theme</label>
            <select id="theme" name="theme">
              <option value="system">System default</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>

          <div class="field">
            <label for="language">Language</label>
            <select id="language" name="language">
              <option value="en">English</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
            </select>
          </div>
        </section>

        <section class="form-section" aria-labelledby="notifications-heading">
          <h2 id="notifications-heading">Notifications</h2>

          <div class="toggle-field">
            <div>
              <span class="toggle-label">Email notifications</span>
              <span class="toggle-description">Receive updates and alerts by email.</span>
            </div>
            <label class="switch">
              <input type="checkbox" id="email-notifications" name="emailNotifications" />
              <span class="switch-slider" aria-hidden="true"></span>
              <span class="visually-hidden">Email notifications</span>
            </label>
          </div>

          <div class="toggle-field">
            <div>
              <span class="toggle-label">Push notifications</span>
              <span class="toggle-description">Get real-time alerts in your browser.</span>
            </div>
            <label class="switch">
              <input type="checkbox" id="push-notifications" name="pushNotifications" />
              <span class="switch-slider" aria-hidden="true"></span>
              <span class="visually-hidden">Push notifications</span>
            </label>
          </div>
        </section>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="reset-btn">Reset</button>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </div>

        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script src="/js/settings.js"></script>
  </body>
</html>
